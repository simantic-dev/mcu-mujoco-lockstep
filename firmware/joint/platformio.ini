; One robot joint on a NUCLEO-G474RE: SimpleFOC angle control, an SPI magnetic encoder, a target angle over CAN.
[env:nucleo_g474re]
platform = ststm32@20.0.0
board = nucleo_g474re
framework = arduino
; compile the SimpleFOC libraries as objects, not an archive: with an archive its STM32-specific PWM driver is dropped for the generic one
lib_archive = false
lib_deps =
	SPI
	simplefoc/SimpleFOCDrivers@1.0.9
	askuric/Simple FOC@2.4.0
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D HAL_FDCAN_MODULE_ENABLED
	-D USE_HAL_DRIVER
	-D SIMPLEFOC_STM32_DEBUG
