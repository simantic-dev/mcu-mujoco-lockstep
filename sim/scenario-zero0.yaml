# As scenario.yaml, with the firmware built for an encoder that reads 0 at the rest pose (ENC_REST_ANGLE=0): the firmware (firmware/joint) on a simulated STM32G474 with a MuJoCo arm, an MT6835 encoder and a CAN master.
# Part scripts and the elf are relative to this file; overlay peers relative to the repository root, where sim runs.
machines:
  dut:
    mcu: STM32G474RET6
    overlay: joint.board
    elf: build/joint-zero0.elf
    parts:
      - { name: plant,   type: peripheral, address: 0xA0000400, size: 0x4, script: peers/arm_plant.py }
      - { name: encoder, type: spi-device, bus: spi1, cs: PA0, script: peers/mt6835_peer.py }
media:
  - type: can
    connect: [dut.fdcan2, dut.canpeer]
timeout: 11
